<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <script>try{var t=localStorage.getItem("tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Editor">
  <meta name="description" content="Editor de fotos personal: se abre en el navegador y funciona sin conexión.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Editor de fotos</title>
</head>
<body data-mode="edit">
  <div id="app">
    <header class="bar">
      <span class="brand">Editor <em>fotos</em></span>
      <button id="btnOpen" class="btn primary"><span class="lg">Abrir fotos</span><span class="sm">Abrir</span></button>
      <div class="group">
        <button id="btnUndo" class="btn icon" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled>↶</button>
        <button id="btnRedo" class="btn icon" title="Rehacer (Ctrl+Mayús+Z)" aria-label="Rehacer" disabled>↷</button>
      </div>
      <button id="btnCompare" class="btn" title="Mantén pulsado para ver el original (tecla \)" disabled><span class="lg">Antes / después</span><span class="sm">Antes</span></button>
      <button id="btnReset" class="btn" title="Restablecer todos los ajustes" aria-label="Restablecer" disabled><span class="lg">Restablecer</span><span class="sm">↺</span></button>
      <span class="spacer"></span>
      <button id="btnTheme" class="btn icon" title="Cambiar tema claro / oscuro" aria-label="Cambiar tema">◐</button>
      <button id="btnExport" class="btn primary" disabled>Exportar</button>
    </header>

    <main>
      <section id="stage" aria-label="Vista de la foto">
        <div id="viewport">
          <div id="empty">
            <h1>Editor de <em>fotos</em></h1>
            <p>Abre una o varias fotos, o arrástralas aquí.<br>Todo se procesa en tu dispositivo; nada se sube a ningún servidor.</p>
            <div class="row">
              <button id="btnOpen2" class="btn primary big">Abrir fotos</button>
              <button id="btnSample" class="btn big">Probar con una imagen de ejemplo</button>
            </div>
            <p class="hint">Formatos: JPEG, PNG, WebP (y HEIC en Safari).</p>
          </div>
          <div id="canvasWrap">
            <canvas id="view"></canvas>
            <canvas id="overlay"></canvas>
            <div id="compareTag" hidden>Original</div>
            <div id="zoomBar" role="group" aria-label="Zoom" hidden>
              <button id="zoomOut" type="button" title="Alejar (tecla -)" aria-label="Alejar">−</button>
              <button id="zoomLabel" type="button" title="Ajustar a la pantalla (tecla 0)">Ajustar</button>
              <button id="zoomIn" type="button" title="Acercar (tecla +)" aria-label="Acercar">+</button>
              <button id="zoom100" type="button" title="Un píxel de la foto por píxel de pantalla">1:1</button>
            </div>
          </div>
          <div id="autoWrap"></div>
          <div id="printWrap">
            <canvas id="printCanvas"></canvas>
            <div id="printInfo" class="hint"></div>
          </div>
        </div>
        <div id="filmstrip" hidden></div>
      </section>

      <aside id="panel" aria-label="Ajustes">
        <div id="modeSwitch" role="tablist" aria-label="Modo">
          <button role="tab" data-mode="edit" class="on">Editar</button>
          <button role="tab" data-mode="print">Imprimir</button>
          <button role="tab" data-mode="auto" id="modeAuto">Automático</button>
        </div>
        <div class="histWrap">
          <canvas id="hist" width="256" height="64"></canvas>
          <div id="clipInfo" class="clipInfo"></div>
        </div>
        <nav id="tabs" role="tablist">
          <button role="tab" data-tab="adjust" class="on">Ajustes</button>
          <button role="tab" data-tab="curves">Curvas</button>
          <button role="tab" data-tab="geometry">Recorte</button>
          <button role="tab" data-tab="retouch">Retoque</button>
          <button role="tab" data-tab="masks">Máscaras</button>
          <button role="tab" data-tab="presets">Presets</button>
        </nav>
        <div id="tabBody" class="scrollbody">
          <section data-tab="adjust" id="tabAdjust"></section>
          <section data-tab="curves" id="tabCurves" hidden></section>
          <section data-tab="geometry" id="tabGeometry" hidden></section>
          <section data-tab="retouch" id="tabRetouch" hidden></section>
          <section data-tab="masks" id="tabMasks" hidden></section>
          <section data-tab="presets" id="tabPresets" hidden></section>
        </div>
        <div id="printBody" class="scrollbody"></div>
        <div id="autoBody" class="scrollbody"></div>
      </aside>
    </main>
  </div>

  <input id="file" type="file" accept="image/*,.arw,.sr2,.srf,.cr2,.cr3,.crw,.nef,.nrw,.dng,.raf,.orf,.rw2,.rwl,.pef,.srw,.3fr,.fff,.erf,.kdc,.dcr,.mrw,.iiq,.mef,.mos,.x3f" multiple hidden>
  <input id="filePresets" type="file" multiple hidden>
  <input id="fileAutoTest" type="file" accept="image/*,.arw,.sr2,.srf,.cr2,.cr3,.crw,.nef,.nrw,.dng,.raf,.orf,.rw2,.rwl,.pef,.srw,.3fr,.fff,.erf,.kdc,.dcr,.mrw,.iiq,.mef,.mos,.x3f" hidden>
  <input id="fileAutoCapture" type="file" accept="image/*" capture="environment" hidden>
  <input id="fileLook" type="file" accept=".cube,text/plain" multiple hidden>

  <dialog id="exportDlg">
    <form method="dialog">
      <h2>Exportar</h2>
      <label>Formato
        <select id="expType">
          <option value="image/jpeg">JPEG (ligero)</option>
          <option value="image/png">PNG (sin pérdida)</option>
          <option value="image/webp">WebP</option>
        </select>
      </label>
      <label id="expQualityRow">Calidad <output id="expQualityOut">92</output>
        <input id="expQuality" type="range" min="50" max="100" value="92">
      </label>
      <label class="check"><input id="expWm" type="checkbox"> Poner el logo de un restaurante</label>
      <div id="expWmBox" hidden>
        <label>Restaurante <select id="expWmBrand"></select></label>
        <label>Posición
          <select id="expWmPos">
            <option value="top-left">Arriba izquierda</option><option value="top-center">Arriba centro</option><option value="top-right">Arriba derecha</option>
            <option value="center">Centro</option>
            <option value="bottom-left">Abajo izquierda</option><option value="bottom-center">Abajo centro</option><option value="bottom-right">Abajo derecha</option>
          </select>
        </label>
        <label>Tamaño <output id="expWmSizeOut">18</output> %
          <input id="expWmSize" type="range" min="5" max="60" value="18">
        </label>
        <label>Opacidad <output id="expWmOpOut">85</output> %
          <input id="expWmOp" type="range" min="10" max="100" value="85">
        </label>
        <p id="expWmNote" class="hint"></p>
      </div>
      <p id="expInfo" class="hint"></p>
      <div class="row end">
        <button value="cancel" class="btn">Cancelar</button>
        <button id="expGo" value="go" class="btn primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="printSheet" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
